name: Full API & DevSecOps Security Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-and-code-security:
    runs-on: ubuntu-latest

    steps:
      # 1. Pakua mafaili yako yote (main.py, config.json, modules, spec.yml)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. SEMGREP: Kagua udhaifu wa kiusalama ndani ya kodi yako ya Python
      - name: Run Semgrep SAST
        run: |
          pip install semgrep
          semgrep --config p/owasp-top-ten .

      # 3. TRIVY: Kagua udhaifu wa maktaba (CVEs) na siri zilizovuja (Secrets)
      - name: Run Trivy Vulnerability & Secret Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'

      # 4. SPECTRAL: Kagua muundo na usalama wa faili lako la spec.yml (OpenAPI)
      - name: Lint OpenAPI Spec (spec.yml)
        run: |
          npm install -g @stoplight/spectral-cli
          spectral lint spec.yml
