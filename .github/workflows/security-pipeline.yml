name: API Automation & Security Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  security-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Pakua mafaili yako (main.py, config.json, modules)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Kagua kama kuna API keys, tokens au nywila zilizoachwa kwenye config.json au kodi
      - name: Scan for Secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Weka mazingira ya Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 4. Pakua zana za ukaguzi wa kodi ya Python (Bandit & Semgrep)
      - name: Install Security & Automation Libraries
        run: |
          python -m pip install --upgrade pip
          pip install bandit requests
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 5. Kagua udhaifu wa usalama ndani ya kodi yako ya Python (Bandit SAST)
      - name: Run Bandit Security Scan
        run: |
          bandit -r . -ll

      # 6. Endesha script yako ya automation (Ikiwa tayari inafanya kazi bila kuhitaji local server)
      # Ondoa alama ya # hapa chini ukishakuwa tayari kuendesha main.py moja kwa moja
      # - name: Run crAPI Automation Script
      #   run: python main.py
