        required: false
        schema:
          type: number
      - name: offset
        in: query
        required: false
        schema:
          type: number
    post:
      summary: POST orders by id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  qr_code_url:
                    type: string
                  order:
                    type: object
                    properties:
                      id:
                        type: number
                      user:
                        type: object
                        properties:
                          email:
                            type: string
                          number:
                            type: string
                      product:
                        type: object
                        properties:
                          id:
                            type: number
                          name:
                            type: string
                          price:
                            type: string
                          image_url:
                            type: string
                      quantity:
                        type: number
                      status:
                        type: string
                      transaction_id:
                        type: string
                      created_on:
                        type: string
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: order_id
        in: query
        required: false
        schema:
          type: number
  /workshop/api/shop/return_qr_code:
