    post:
      summary: POST verify
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  status:
                    type: number
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
  /identity/api/auth/login:
    post:
      summary: POST login
      responses:
        '200':
