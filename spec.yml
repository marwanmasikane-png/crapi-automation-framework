              schema:
                type: object
                properties:
                  token:
                    type: string
                  type:
                    type: string
                  message:
                    type: string
                  mfaRequired:
                    type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
